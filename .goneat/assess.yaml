# goneat assessment policy for structcorpus.
#
# Run format:  goneat assess --categories format --fix
# Run lint:    goneat assess --categories lint
#
# fixtures/ and expected/ are byte-exact (DDR-0001) and are excluded in
# .goneatignore; no tool may rewrite them.

version: 1

lint:
  yamllint:
    enabled: true
    strict: false
    paths:
      - "**/*.yml"
      - "**/*.yaml"
    ignore:
      - ".git/**"
      - "fixtures/**"
      - "expected/**"

  github_actions:
    actionlint:
      enabled: true
      paths:
        - ".github/workflows/**/*.yml"
        - ".github/workflows/**/*.yaml"
      ignore:
        - ".git/**"

  shell:
    paths: ["**/*.sh"]
    ignore:
      - ".git/**"
    shfmt:
      enabled: true
      fix: false
      args: ["-i", "2", "-ci"]
    shellcheck:
      enabled: false

  make:
    checkmake:
      enabled: true
      config:
        max_body_length: 40
        min_phony_targets:
          - all
          - clean
          - help
          - check
          - fmt
          - lint
    paths:
      - "**/Makefile"
    ignore:
      - ".git/**"
