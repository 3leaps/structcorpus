name: check
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  corpus:
    name: corpus (${{ matrix.runner }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            python: "3.9"
          - runner: ubuntu-latest
            python: "3.14"
          - runner: macos-15
            python: "3.14"
          - runner: windows-latest
            python: "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test corpus tool
        run: python -m unittest discover -s tests -v
      - name: Validate repository
        run: python tools/corpus.py validate
      - name: Hydrate twice and compare
        run: python tools/hydrate-twice.py conformance
  corpus-arm64:
    name: corpus (${{ matrix.runner }}, python ${{ matrix.python }})
    # Custom ARM64 runners are available only for branches in this repository.
    # yamllint disable rule:line-length
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # yamllint enable rule:line-length
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest-arm64-s
            python: "3.14"
          - runner: windows-latest-arm64-s
            python: "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test corpus tool
        run: python -m unittest discover -s tests -v
      - name: Validate repository
        run: python tools/corpus.py validate
      - name: Hydrate twice and compare
        run: python tools/hydrate-twice.py conformance
  goneat:
    name: format, lint, schemas (goneat)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # The digest-pinned tools image bundles goneat, ruff, yamllint, yamlfmt,
      # shfmt, actionlint, and checkmake; nothing is installed.
      # yamllint disable-line rule:line-length
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.9@sha256:412a315241a59fc0313f4e79f182f7f373a04f194174c61b439cf8ba26174d54
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Show toolchain
        run: |
          goneat --version
          ruff --version
      - name: Record fixture bytes
        run: find fixtures -type f -exec sha256sum {} + | sort > "$RUNNER_TEMP/fixtures.before"
      - name: Check formatting
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: Validate schemas and metadata
        run: make schemas
      - name: Prove formatting never rewrites fixtures
        run: |
          set -euo pipefail
          make fmt
          find fixtures -type f -exec sha256sum {} + | sort > "$RUNNER_TEMP/fixtures.after"
          diff "$RUNNER_TEMP/fixtures.before" "$RUNNER_TEMP/fixtures.after"
          git diff --exit-code
